[dataset]
# 원본 비율을 유지하며 면적이 약 max_pixels가 되도록 맞춥니다(anima-lora free-fit).
# 각 변은 16의 배수입니다. 262144 = 512 × 512. 작은 원본은 이 면적까지 확대합니다.
max_pixels = 262144
# 이미지는 한 장씩 계산합니다. batch_size × gradient_accumulation_steps장을 누적해
# optimizer를 한 번 업데이트합니다(유효 batch).
batch_size = 4
repeat = 6
caption_dropout_rate = 0.1

[lora]
base_model = "dit"
rank = 32
alpha = 128
target_modules = ""

[training]
optimizer = "AdamW"
learning_rate = 2e-5
weight_decay = 0.01
lr_scheduler = "cosine"
warmup_ratio = 0.05
# max_steps와 저장 간격은 gradient accumulation 이후 optimizer 업데이트 기준.
max_steps = 2400
gradient_accumulation_steps = 1
seed = 42
max_grad_norm = 1.0
sigmoid_scale = 1.0
sigmoid_bias = 0.0

[runtime]
mixed_precision = "bf16"
use_gradient_checkpointing = true

[checkpoint]
save_steps = 50
